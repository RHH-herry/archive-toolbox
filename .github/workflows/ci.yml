name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 功能测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 的 engines 为 ^22.22.2 || ^24.15.0 || >=26.0.0，不支持 Node 20
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖（跳过 Electron 二进制下载）
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行 42 项功能测试
        run: npm test

  static-check:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: JS 语法检查
        run: |
          for f in app.js main.js preload.js test/functional.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: 确认没有外部资源加载
        run: |
          # 只检查真正会发起网络请求的标签，元数据链接（canonical / og:url / JSON-LD）不算
          FOUND=0
          if grep -nE '<(script|img|iframe|source|video|audio)[^>]*src="https?://' index.html splash.html; then FOUND=1; fi
          if grep -nE '<link[^>]*rel="(stylesheet|preload|prefetch|modulepreload)"[^>]*href="https?://' index.html splash.html; then FOUND=1; fi
          if grep -nE '@import[[:space:]]+(url\()?"?https?://' styles.css splash.css; then FOUND=1; fi
          if [ "$FOUND" = "1" ]; then
            echo "::error::检测到外部资源加载，违反零外部请求原则"
            exit 1
          fi
          echo "OK 无外部资源加载"

      - name: 确认无遥测代码
        run: |
          if grep -rnE '(google-analytics|googletagmanager|sentry\.io|hotjar|mixpanel|hm\.baidu\.com|umami|plausible\.io)' \
               app.js main.js preload.js index.html splash.html; then
            echo "::error::检测到遥测/分析代码"
            exit 1
          fi
          echo "OK 无遥测代码"

      - name: 确认 Electron 安全基线
        run: |
          grep -q 'contextIsolation: *true' main.js || { echo "::error::contextIsolation 未开启"; exit 1; }
          grep -q 'nodeIntegration: *false' main.js || { echo "::error::nodeIntegration 未关闭"; exit 1; }
          echo "OK Electron 安全基线正常"
