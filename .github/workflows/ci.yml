name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 功能测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖（跳过 Electron 二进制下载）
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行 42 项功能测试
        run: npm test

  static-check:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        run: |
          for f in app.js main.js preload.js test/functional.js; do
            node --check "$f" && echo "OK  $f"
          done

      - name: 确认没有外部 CDN 引用
        run: |
          if grep -rnE '(src|href)="https?://' index.html splash.html; then
            echo "::error::检测到外部资源引用，违反零外部请求原则"
            exit 1
          fi
          echo "OK 无外部资源引用"

      - name: 确认 Electron 安全基线
        run: |
          grep -q 'contextIsolation: *true' main.js || { echo "::error::contextIsolation 未开启"; exit 1; }
          grep -q 'nodeIntegration: *false' main.js || { echo "::error::nodeIntegration 未关闭"; exit 1; }
          echo "OK Electron 安全基线正常"
