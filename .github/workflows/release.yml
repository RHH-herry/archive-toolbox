name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定版本标签（如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建安装包
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 SHA-256 校验和
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe
          if ($files.Count -eq 0) { throw "未找到 exe 产物" }
          $lines = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            $lines += "$hash  $($f.Name)"
            Write-Host "$hash  $($f.Name)"
          }
          $lines -join "`n" | Out-File -FilePath dist/checksums.sha256 -Encoding ascii -NoNewline

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem -Path dist | Format-Table Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/checksums.sha256
          retention-days: 14

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/checksums.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
