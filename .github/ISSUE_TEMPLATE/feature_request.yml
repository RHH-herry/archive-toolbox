name: ✨ 功能建议 / Feature Request
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。请先说明「你想解决什么问题」，再说「你希望怎么解决」—— 这样更容易讨论出好方案。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复建议
          required: true
        - label: 我理解本项目坚持「纯本地运行、零上传、无遥测」，我的建议不违背这一原则
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前的痛点，而不是直接给方案
      placeholder: 我经常需要 ...，但现在只能 ...，很麻烦
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      placeholder: 希望增加一个 ... 功能，可以 ...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 压缩功能
        - 解压功能
        - 校验 / 哈希
        - 拆分合并
        - 界面 / 交互
        - 桌面版
        - 性能
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在你是怎么绕过这个问题的？用了什么别的工具？

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 来实现这个功能
