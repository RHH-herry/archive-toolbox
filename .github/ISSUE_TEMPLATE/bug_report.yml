name: 🐛 Bug 报告 / Bug Report
description: 报告一个问题，帮助我们修复它
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题。请尽量填全下面的信息，这能大幅加快定位速度。

        > ⚠️ **安全漏洞请不要在这里公开提交**，请按 [SECURITY.md](https://github.com/RHH-herry/archive-toolbox/blob/main/SECURITY.md) 的流程私下披露。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复问题
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么
      placeholder: 点击「全部解压」后页面卡住，没有任何反应
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 我们需要能稳定复现才能修
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 拖入一个 ... 的文件
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 应该正常解压出全部文件
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行形态
      options:
        - 网页版（浏览器打开）
        - 桌面版（安装包）
        - 本地文件直接打开（file://）
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      description: 桌面版可选「不适用」
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - 其他 Chromium 内核
        - 不适用（桌面版）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本信息
      description: 系统版本 + 浏览器版本 + 本项目版本
      placeholder: "Windows 11 23H2 / Chrome 126.0.6478.127 / v1.0.0"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 控制台报错
      description: 按 F12 打开开发者工具，把 Console 面板的红色报错贴过来
      render: text

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、录屏、样例文件（注意脱敏）等
